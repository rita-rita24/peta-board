name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.15.0", "3.14.8"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.0.0
        id: python
        continue-on-error: ${{ matrix.python == '3.15.0' }}
        with:
          python-version: ${{ matrix.python }}
      - name: Build stable Python 3.15 when the action archive is unavailable
        if: steps.python.outcome == 'failure' && matrix.python == '3.15.0'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev libncurses-dev libzstd-dev
          PETA_PYTHON_SOURCE="$RUNNER_TEMP/peta-python315-source"
          PETA_PYTHON_PREFIX="$RUNNER_TEMP/peta-python315"
          mkdir -p "$PETA_PYTHON_SOURCE"
          curl -fSL --retry 3 https://www.python.org/ftp/python/3.15.0/Python-3.15.0.tar.xz -o "$PETA_PYTHON_SOURCE/source.tar.xz"
          printf '%s  %s\n' ba4bed1ba346b916890b76d9e320451420aa69f6408997d33c66482eeae3d575 "$PETA_PYTHON_SOURCE/source.tar.xz" | sha256sum --check --status
          tar -xf "$PETA_PYTHON_SOURCE/source.tar.xz" -C "$PETA_PYTHON_SOURCE"
          cd "$PETA_PYTHON_SOURCE/Python-3.15.0"
          ./configure --prefix="$PETA_PYTHON_PREFIX" --with-ensurepip=install
          make -j2
          make install
          ln -s python3.15 "$PETA_PYTHON_PREFIX/bin/python"
          printf '%s\n' "$PETA_PYTHON_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'PYTHON=%s/bin/python3.15\n' "$PETA_PYTHON_PREFIX" >> "$GITHUB_ENV"
      - name: Verify the requested stable interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: python -c "import os, platform; assert platform.python_version() == os.environ['EXPECTED_PYTHON']"
      - run: python -m pip install -r requirements-dev.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run ci
        env:
          BROWSERS: chromium,firefox,webkit
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-python-${{ matrix.python }}
          path: performance/verification/
